<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي أجهزة التخدير والمختبر الافتراضي | تقنيات التخدير</title>
    <link rel="stylesheet" href="virtual-lab.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#07111F] text-slate-100 min-h-screen font-['Cairo'] p-4 md:p-8">
    <header class="max-w-7xl mx-auto flex justify-between items-center pb-6 border-b border-slate-800 mb-8">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl">
                <i class="fa-solid fa-laptop-medical"></i>
            </div>
            <div>
                <h1 class="text-base font-black text-white">المختبر الافتراضي ومحاكي أجهزة التخدير</h1>
                <p class="text-xs text-cyan-400">Anesthesia Virtual Simulator & ICU Monitor</p>
            </div>
        </div>
        <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold transition">
            <i class="fa-solid fa-arrow-right ml-1"></i> العودة للرئيسية
        </a>
    </header>

    <main class="max-w-7xl mx-auto space-y-6">
        <div class="bg-slate-900/90 border border-cyan-500/20 p-6 rounded-3xl space-y-4">
            <h2 class="text-base font-bold text-cyan-400 flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse"></i> شاشة مراقبة العلامات الحيوية (Patient Monitor Simulation)
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                    <span class="block text-xs text-slate-400">معدل ضربات القلب (HR)</span>
                    <span id="hr-val" class="text-2xl font-black text-emerald-400 font-mono">75 bpm</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                    <span class="block text-xs text-slate-400">ضغط الدم (BP)</span>
                    <span class="text-2xl font-black text-cyan-400 font-mono">120/80</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                    <span class="block text-xs text-slate-400">تشبع الأكسجين (SpO2)</span>
                    <span class="text-2xl font-black text-blue-400 font-mono">99%</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                    <span class="block text-xs text-slate-400">ثاني أكسيد الكربون (EtCO2)</span>
                    <span class="text-2xl font-black text-amber-400 font-mono">38 mmHg</span>
                </div>
            </div>
        </div>
    </main>
    <script src="virtual-lab.js"></script>
</body>
</html>
